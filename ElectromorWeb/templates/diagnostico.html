<!DOCTYPE html>
<html>
<head>
    <title>Diagnóstico y Reparación</title>
</head>
<body>
    <h2>Diagnóstico</h2>
    <form method="POST">
        <textarea name="descripcion" placeholder="Descripción del diagnóstico"></textarea>
        <textarea name="trabajos" placeholder="Trabajos realizados"></textarea>
        <textarea name="repuestos" placeholder="Repuestos utilizados"></textarea>
        <textarea name="pruebas" placeholder="Pruebas efectuadas"></textarea>
        <textarea name="observaciones" placeholder="Observaciones"></textarea>
        <select name="orden_id">
            {% for o in ordenes %}
                <option value="{{ o.id }}">Orden {{ o.id }} - Motor {{ o.motor.marca }}</option>
            {% endfor %}
        </select>
        <button type="submit">Guardar Diagnóstico</button>
    </form>
    <h3>Diagnósticos registrados</h3>
    <ul>
        {% for d in diagnosticos %}
            <li>{{ d.descripcion }} - Orden: {{ d.orden.id }}</li>
        {% endfor %}
    </ul>
</body>
</html>
